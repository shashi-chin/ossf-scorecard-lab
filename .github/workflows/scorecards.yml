# OpenSSF Scorecard workflow
#
# Private-repo viewing strategy (also works when public):
# 1) Run Scorecard → results.json + results.sarif
# 2) Build scorecard-report.html in CI (make_report.py)
# 3) Upload all three as Actions artifact "scorecard-results"
# 4) Humans download the zip and open scorecard-report.html in a browser
#
# scorecard.dev / public badge only apply when the repo is public and
# publish_results: true. Private repos should keep publish_results: false.

name: OpenSSF Scorecard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "30 1 * * 6"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis (SARIF)
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # For a real private repo, set publish_results: false
          # (public lab keeps true so scorecard.dev still works)
          publish_results: true

      - name: Run analysis (JSON score table)
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: false

      # Private-friendly viewer: no scorecard.dev required
      - name: Build HTML viewer
        run: python3 make_report.py --input results.json --output scorecard-report.html

      - name: Upload Scorecard artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: |
            results.sarif
            results.json
            scorecard-report.html
          retention-days: 14

      - name: Upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
