# OpenSSF Scorecard — public-repo lab configuration
#
# What this gives you:
# - Per-check security posture scores (0–10) for supply-chain / repo hygiene
# - SARIF + JSON artifacts on each run (Actions → Artifacts)
# - Code Scanning alerts (Security → Code scanning) on public repos
# - Published results + badge via api.scorecard.dev / scorecard.dev viewer
#
# Optional: create a fine-grained PAT (read-only) as secret SCORECARD_TOKEN
# for fuller Branch-Protection / admin-gated settings. See README.

name: OpenSSF Scorecard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "30 1 * * 6"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis (SARIF for Code Scanning)
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Uncomment after adding repo secret SCORECARD_TOKEN (fine-grained PAT):
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # Publishes to public Scorecard API so badge + scorecard.dev viewer work
          publish_results: true

      - name: Run analysis (JSON score table)
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          # Only one step should publish; keep false here
          publish_results: false

      - name: Upload Scorecard artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: |
            results.sarif
            results.json
          retention-days: 14

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
